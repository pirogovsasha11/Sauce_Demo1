name: CI

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: 'corretto'
          java-version: '25'
      - name: Build and run tests
        run: mvn clean test

      - name: Generate Allure results
        uses: actions/upload-artifact@v4
        if: always()
        with:
                    name: allure-report
                    patch: target/side/allure-maven-plugin
